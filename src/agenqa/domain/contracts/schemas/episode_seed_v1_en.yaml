contract:
  instruction: |
    Extract a stable episode_seed from the input material for downstream multi-step reasoning QA.
    Do not restate final conclusions/answers; keep reusable, non-redundant information only.
    The output must strictly follow the output_schema.
  output_schema:
    type: object
    additionalProperties: false
    properties:
      subject:
        type: string
        description: "Primary subject area (discipline-subfield)"
      keywords:
        type: array
        items: { type: string }
        minItems: 5
        maxItems: 10
        description: "5-10 keywords/phrases (deduplicated)"
      anchor_fields:
        type: object
        additionalProperties: false
        properties:
          topic_task:
            type: string
            description: "Topic/Task description"
          core_objects_symbols:
            type: string
            description: "Core objects/symbols"
          regime_assumptions:
            type: string
            description: "Regime/assumptions/conditions"
        required:
          - topic_task
          - core_objects_symbols
          - regime_assumptions
    required:
      - subject
      - keywords
      - anchor_fields
